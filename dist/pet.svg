      <stop offset="0%" stop-color="#1b324f"/>
      <stop offset="100%" stop-color="#0c1a2b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
