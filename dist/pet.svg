        <circle cx="3" cy="-7" r="2" fill="#5f27cd"/>
        <circle cx="2" cy="-14" r="1" fill="#54a0ff"/>
        <!-- Crack / Sleep dots -->
        <text x="12" y="-15" font-family="monospace" font-size="8" fill="#fff" opacity="0.6">zZ</text>
      </g>
    

